# Cloudflare Workers Builds: use the repository root and run `npm run build`
# before `wrangler deploy` or `wrangler preview` in the dashboard settings.
# CLI: npm run cf:pages:deploy

name = "ccc"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "NOTIFY"
id = "d0609641ea414bcc94eede2a5ce75b96"
remote = true

# Required for `wrangler preview` (Worker open beta); `pages_build_output_dir` alone is not enough.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Required for `wrangler preview` (can be empty; inherits top-level assets).
[previews]

# Cloudflare Pages preview deployments (not the same as Workers `wrangler preview`).
[env.preview.vars]
APP_ENV = "preview"
